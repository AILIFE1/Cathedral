[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cathedral-mcp"
version = "1.1.0"
description = "MCP server for Cathedral — persistent memory and drift detection for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "ai", "agents", "memory", "persistence", "drift", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[project.scripts]
cathedral-mcp = "cathedral_mcp.server:main"

[project.urls]
Homepage = "https://cathedral-ai.com"
Repository = "https://github.com/AILIFE1/Cathedral"
Documentation = "https://cathedral-ai.com/docs"
"Bug Tracker" = "https://github.com/AILIFE1/Cathedral/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cathedral_mcp"]
